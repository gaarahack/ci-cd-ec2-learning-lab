<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEON RUSH — Mini Game</title>
<style>
  :root { --cyan:#69f7ff; --pink:#ff4fd8; --purple:#9d72ff; --bg:#070816; }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:#f6f7ff; font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif; }
  body { display:grid; place-items:center; }
  #game { position:relative; width:min(100vw,1100px); height:min(100vh,720px); min-height:480px; overflow:hidden; isolation:isolate; background:radial-gradient(ellipse at 50% 20%,#20204b 0%,#0b0d24 42%,#070816 100%); border:1px solid #ffffff20; box-shadow:0 0 80px #3e31a522; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  .grid { position:absolute; inset:42% -30% -40%; z-index:0; opacity:.35; transform:perspective(320px) rotateX(58deg); transform-origin:top; background-image:linear-gradient(#6e66ff35 1px,transparent 1px),linear-gradient(90deg,#6e66ff35 1px,transparent 1px); background-size:42px 42px; mask-image:linear-gradient(to bottom,transparent,#000 25%,#000); animation:gridMove 3s linear infinite; }
  @keyframes gridMove { to { background-position:0 42px,42px 0; } }
  .scanlines { pointer-events:none; position:absolute; inset:0; z-index:2; opacity:.12; background:repeating-linear-gradient(transparent 0 3px,#000 4px 5px); }
  .topbar { position:absolute; z-index:4; top:22px; left:24px; right:24px; display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .brand { font-size:12px; letter-spacing:.28em; color:#b7b8db; font-weight:800; }
  .brand b { color:var(--cyan); text-shadow:0 0 14px #69f7ff88; }
  .stats { display:flex; gap:10px; }
  .stat { min-width:86px; padding:9px 13px; border:1px solid #ffffff20; background:#0a0b20b8; backdrop-filter:blur(10px); border-radius:12px; }
  .stat small { display:block; color:#9296c2; font-size:9px; letter-spacing:.2em; font-weight:800; }
  .stat strong { display:block; margin-top:2px; font-size:18px; letter-spacing:.04em; }
  .stat strong.cyan { color:var(--cyan); } .stat strong.pink { color:var(--pink); }
  .intro { position:absolute; z-index:3; left:50%; top:43%; transform:translate(-50%,-50%); width:min(90%,560px); text-align:center; transition:opacity .25s, transform .25s; }
  .eyebrow { display:inline-flex; align-items:center; gap:8px; padding:7px 11px; border:1px solid #8e82ff55; border-radius:99px; color:#c6c0ff; background:#7062ff12; font-size:10px; font-weight:800; letter-spacing:.2em; }
  .dot { width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan); }
  h1 { margin:18px 0 8px; font-size:clamp(44px,9vw,90px); line-height:.9; letter-spacing:-.075em; font-weight:950; text-transform:uppercase; }
  h1 span { color:transparent; -webkit-text-stroke:1.5px var(--cyan); text-shadow:0 0 32px #69f7ff2b; }
  .subtitle { color:#a6a9d0; font-size:14px; line-height:1.6; max-width:390px; margin:17px auto 23px; }
  button { border:0; cursor:pointer; font:inherit; }
  .primary { position:relative; padding:14px 24px; border-radius:12px; color:#08091a; font-weight:950; letter-spacing:.13em; font-size:12px; background:linear-gradient(100deg,var(--cyan),#b6fbff); box-shadow:0 0 28px #69f7ff36; transition:transform .18s,box-shadow .18s; }
  .primary:hover { transform:translateY(-2px); box-shadow:0 0 42px #69f7ff70; }
  .hint { margin-top:14px; font-size:10px; letter-spacing:.12em; color:#72769f; }
  .hidden { opacity:0; pointer-events:none; transform:translate(-50%,-46%); }
  .bottom { position:absolute; z-index:4; bottom:18px; left:24px; right:24px; display:flex; align-items:center; justify-content:space-between; color:#75799f; font-size:10px; letter-spacing:.12em; }
  .bottom b { color:#b6b9e3; }
  .sound { background:#ffffff0b; border:1px solid #ffffff20; color:#c5c8ef; border-radius:10px; padding:8px 10px; font-size:10px; letter-spacing:.1em; }
  .toast { position:absolute; z-index:5; top:105px; left:50%; transform:translateX(-50%); color:var(--cyan); font-weight:900; font-size:12px; letter-spacing:.2em; text-shadow:0 0 18px var(--cyan); opacity:0; transition:opacity .2s; white-space:nowrap; }
  .toast.show { opacity:1; }
  .touch { position:absolute; z-index:5; bottom:60px; left:0; right:0; display:none; justify-content:space-between; padding:0 24px; pointer-events:none; }
  .touch button { pointer-events:auto; width:58px; height:58px; border:1px solid #69f7ff55; border-radius:18px; color:var(--cyan); background:#0b102bcc; font-size:24px; box-shadow:0 0 22px #69f7ff15; touch-action:none; }
  @media (max-width:600px) { #game { min-height:100%; height:100%; border:0; } .topbar { top:14px; left:14px; right:14px; align-items:flex-start; } .stats { gap:5px; } .stat { min-width:65px; padding:7px 8px; } .stat strong { font-size:15px; } .brand { margin-top:10px; font-size:10px; } .bottom { left:14px; right:14px; bottom:12px; } .touch { display:flex; } .intro { top:44%; } .subtitle { font-size:12px; } }
</style>
</head>
<body>
<main id="game" aria-label="Neon Rush arcade game">
  <div class="grid"></div>
  <canvas id="canvas"></canvas>
  <div class="scanlines"></div>
  <header class="topbar">
    <div class="brand">✦ <b>NEON</b> / RUSH</div>
    <div class="stats">
      <div class="stat"><small>SCORE</small><strong class="cyan" id="score">0000</strong></div>
      <div class="stat"><small>BEST</small><strong id="best">0000</strong></div>
      <div class="stat"><small>SHIELDS</small><strong class="pink" id="lives">♥♥♥</strong></div>
    </div>
  </header>
  <div class="toast" id="toast">+100 ENERGY</div>
  <section class="intro" id="intro">
    <div class="eyebrow"><span class="dot"></span> ARCADE MODE // 01</div>
    <h1>NEON<br><span>RUSH</span></h1>
    <p class="subtitle">The city is moving. You're the glitch.<br>Dodge the red, collect the light, beat your high score.</p>
    <button class="primary" id="start">▶ &nbsp; START RUN</button>
    <div class="hint">MOVE WITH ← → OR A / D &nbsp; · &nbsp; MOBILE: USE ARROWS</div>
  </section>
  <div class="touch" id="touch">
    <button id="left" aria-label="Move left">←</button><button id="right" aria-label="Move right">→</button>
  </div>
  <footer class="bottom">
    <span>SECTOR 07 <b>·</b> KEEP MOVING</span>
    <button class="sound" id="sound">♫ SOUND: ON</button>
    <span id="status">SYSTEM READY</span>
  </footer>
</main>
<script>
(() => {
  const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
  const game = document.getElementById('game');
  const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best'), livesEl = document.getElementById('lives');
  const intro = document.getElementById('intro'), startBtn = document.getElementById('start'), statusEl = document.getElementById('status');
  const toast = document.getElementById('toast'), soundBtn = document.getElementById('sound');
  let W=0,H=0, running=false, over=false, score=0, lives=3, best=0, frame=0, spawn=0, orbSpawn=0, shake=0, soundOn=true, audio=null;
  try { best = Number(localStorage.getItem('neonRushBest') || 0); } catch(e) {}
  bestEl.textContent = String(best).padStart(4,'0');
  const player = {x:0,y:0,w:24,h:30,vx:0,speed:5.7,inv:0};
  let keys = {left:false,right:false}, obstacles=[], orbs=[], particles=[], stars=[];
  const rand=(a,b)=>Math.random()*(b-a)+a;
  function resize(){ const r=game.getBoundingClientRect(), d=Math.min(devicePixelRatio||1,2); W=r.width; H=r.height; canvas.width=Math.round(W*d); canvas.height=Math.round(H*d); ctx.setTransform(d,0,0,d,0,0); player.y=H*.79; if(!player.x)player.x=W/2; stars=Array.from({length:Math.floor(W*H/6500)},()=>({x:Math.random()*W,y:Math.random()*H,z:rand(.3,1.6),a:rand(.2,.9)})); }
  window.addEventListener('resize',resize); resize();
  function beep(freq=500,duration=.06,type='sine',volume=.025){ if(!soundOn)return; try{ audio ||= new (window.AudioContext||window.webkitAudioContext)(); const o=audio.createOscillator(),g=audio.createGain(); o.type=type;o.frequency.value=freq;g.gain.value=volume;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);o.stop(audio.currentTime+duration); }catch(e){} }
  soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=`♫ SOUND: ${soundOn?'ON':'OFF'}`;if(soundOn)beep(650,.08);};
  function burst(x,y,color,n=14){ for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rand(1,5);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(18,38),max:38,size:rand(1,3.5),color});} }
  function showToast(text){toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),650);}
  function start(){ score=0;lives=3;frame=0;spawn=0;orbSpawn=0;shake=0;obstacles=[];orbs=[];particles=[];player.x=W/2;player.y=H*.79;player.inv=0;running=true;over=false;intro.classList.add('hidden');statusEl.textContent='RUN IN PROGRESS';updateHUD();beep(520,.08); }
  startBtn.addEventListener('click',start);
  function endGame(){running=false;over=true;statusEl.textContent='RUN TERMINATED';burst(player.x,player.y,'#69f7ff',35);beep(130,.35,'sawtooth',.04);intro.classList.remove('hidden');intro.innerHTML=`<div class="eyebrow"><span class="dot"></span> RUN COMPLETE</div><h1>GAME<br><span>OVER</span></h1><p class="subtitle">Score: <b style="color:#69f7ff">${score}</b> &nbsp; / &nbsp; Best: <b>${best}</b><br>${score>=best?'New record. The city remembers.':'One more run? You can beat that.'}</p><button class="primary" id="restart">↻ &nbsp; PLAY AGAIN</button><div class="hint">TIP: KEEP MOVING — SPEED INCREASES OVER TIME</div>`;document.getElementById('restart').onclick=start; }
  function updateHUD(){scoreEl.textContent=String(score).padStart(4,'0');bestEl.textContent=String(best).padStart(4,'0');livesEl.textContent='♥'.repeat(lives)+'♡'.repeat(3-lives);}
  function rectHit(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)/2 && Math.abs(a.y-b.y)<(a.h+b.h)/2;}
  function update(){
    frame++; const difficulty=Math.min(2.4,1+frame/1600), speed=(3.1+frame/900)*difficulty;
    stars.forEach(s=>{s.y+=s.z*speed*.22;if(s.y>H){s.y=0;s.x=Math.random()*W;}});
    if(!running)return;
    if(keys.left)player.x-=player.speed; if(keys.right)player.x+=player.speed;
    player.x=Math.max(22,Math.min(W-22,player.x)); if(player.inv>0)player.inv--;
    spawn++;orbSpawn++;
    if(spawn>Math.max(19,55-frame/70)){spawn=0;const size=rand(24,48);obstacles.push({x:rand(22,W-22),y:-50,w:size,h:size*rand(.8,1.3),rot:rand(0,6),vr:rand(-.045,.045),speed:speed*rand(.8,1.25)});}
    if(orbSpawn>95){orbSpawn=0;orbs.push({x:rand(25,W-25),y:-20,r:8,p:rand(0,6)});}
    for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];o.y+=o.speed;o.rot+=o.vr;if(o.y>H+70){obstacles.splice(i,1);score+=5;continue;}if(player.inv===0&&rectHit({x:player.x,y:player.y,w:player.w*.7,h:player.h*.7},o)){obstacles.splice(i,1);lives--;player.inv=85;shake=13;burst(player.x,player.y,'#ff4fd8',24);beep(105,.18,'square',.04);updateHUD();if(lives<=0){endGame();return;}}}
    for(let i=orbs.length-1;i>=0;i--){const o=orbs[i];o.y+=speed*.7;o.p+=.12;if(o.y>H+20){orbs.splice(i,1);continue;}if(Math.hypot(player.x-o.x,player.y-o.y)<24){orbs.splice(i,1);score+=100;burst(o.x,o.y,'#69f7ff',18);showToast('+100 ENERGY');beep(800,.08);updateHUD();}}
    if(frame%7===0){score+=1;updateHUD();}
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.vy*=.98;p.life--;});particles=particles.filter(p=>p.life>0);
    if(score>best){best=score;bestEl.textContent=String(best).padStart(4,'0');try{localStorage.setItem('neonRushBest',best);}catch(e){}}
  }
  function glow(color,blur){ctx.shadowColor=color;ctx.shadowBlur=blur;}
  function draw(){
    ctx.clearRect(0,0,W,H);
    // atmospheric light
    let g=ctx.createRadialGradient(W*.5,H*.42,0,W*.5,H*.42,W*.6);g.addColorStop(0,'#22225230');g.addColorStop(1,'#08091600');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    stars.forEach(s=>{ctx.globalAlpha=s.a;ctx.fillStyle='#a9caff';ctx.fillRect(s.x,s.y,s.z*1.4,s.z*1.4);});ctx.globalAlpha=1;
    // distant skyline
    const base=H*.63;ctx.fillStyle='#0b0e27';for(let x=0;x<W;x+=36){let bh=35+((Math.sin(x*12.3)+1)*.5)*95;ctx.fillRect(x,base-bh,27,bh);ctx.fillStyle='#27305b';for(let wy=base-bh+12;wy<base-5;wy+=14)for(let wx=x+7;wx<x+23;wx+=10){if(Math.sin(wx*wy)>.2)ctx.fillRect(wx,wy,3,5);}ctx.fillStyle='#0b0e27';}
    // lane streaks
    ctx.lineWidth=1;for(let i=0;i<14;i++){let x=(i/13)*W;ctx.strokeStyle=i%3===0?'#7068ff20':'#6cf8ff0b';ctx.beginPath();ctx.moveTo(W/2+(x-W/2)*.12,H*.61);ctx.lineTo(x,H);ctx.stroke();}
    obstacles.forEach(o=>{ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);glow('#ff3f7e',18);ctx.fillStyle='#ff386b';ctx.strokeStyle='#ffb0cb';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(0,-o.h/2);ctx.lineTo(o.w/2,0);ctx.lineTo(0,o.h/2);ctx.lineTo(-o.w/2,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='#5c102e';ctx.beginPath();ctx.moveTo(-o.w*.22,-o.h*.18);ctx.lineTo(o.w*.2,o.h*.2);ctx.moveTo(o.w*.22,-o.h*.18);ctx.lineTo(-o.w*.2,o.h*.2);ctx.stroke();ctx.restore();});
    orbs.forEach(o=>{ctx.save();ctx.translate(o.x,o.y);let r=o.r+Math.sin(o.p)*2;glow('#69f7ff',22);ctx.strokeStyle='#a7ffff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#69f7ff';ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();ctx.restore();});
    particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;glow(p.color,8);ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;ctx.shadowBlur=0;
    // player ship
    if(!over){ctx.save();ctx.translate(player.x,player.y);if(player.inv>0&&Math.floor(player.inv/5)%2===0)ctx.globalAlpha=.35;glow('#69f7ff',22);
      ctx.fillStyle='#69f7ff';ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(15,13);ctx.lineTo(0,8);ctx.lineTo(-15,13);ctx.closePath();ctx.fill();
      ctx.shadowBlur=0;ctx.fillStyle='#f3ffff';ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(5,5);ctx.lineTo(-5,5);ctx.closePath();ctx.fill();
      ctx.fillStyle='#ff4fd8';glow('#ff4fd8',12);ctx.beginPath();ctx.moveTo(-5,13);ctx.lineTo(0,rand(19,30));ctx.lineTo(5,13);ctx.fill();ctx.restore();}
    if(shake>0){shake--;game.style.transform=`translate(${rand(-3,3)}px,${rand(-3,3)}px)`;}else game.style.transform='';
    requestAnimationFrame(loop);
  }
  function loop(){update();draw();}
  // one animation loop, including menu ambience
  requestAnimationFrame(loop);
  window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;if(e.key===' '&&!running)start();});
  window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false;});
  function bindHold(id,dir){const el=document.getElementById(id);const on=e=>{e.preventDefault();keys[dir]=true;};const off=e=>{e.preventDefault();keys[dir]=false;};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);}
  bindHold('left','left');bindHold('right','right');
})();
</script>
</body>
</html>
